name: Build probe APK

# Builds the module in CI so no local Android SDK is needed. Download the APK
# from the run's Artifacts section - that works fine from a phone browser.
on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # This action's default package list includes the legacy "tools"
          # package, which Google has removed from the SDK repository - it now
          # fails with "Failed to find package 'tools'" before the build even
          # starts. Naming the packages we actually need avoids it, and pins
          # the build to the SDK level the module targets.
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk \
             "out/dex-refresh-probe-${GITHUB_SHA::7}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dex-refresh-probe-apk
          path: out/*.apk
          if-no-files-found: error

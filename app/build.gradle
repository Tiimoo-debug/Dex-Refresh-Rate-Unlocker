plugins {
    id 'com.android.application'
}

android {
    namespace 'com.tiimoo.dexrefresh'
    compileSdk 35

    defaultConfig {
        applicationId 'com.tiimoo.dexrefresh'
        // Target device: Galaxy S22 Ultra on One UI 7 / Android 15 (API 35).
        minSdk 31
        targetSdk 35
        versionCode 1
        versionName '0.1.0-probe'
    }

    signingConfigs {
        debug {
            // A keystore committed to the repo, rather than Gradle's per-machine
            // ~/.android/debug.keystore. CI runs on a fresh machine every time,
            // so that default generated a NEW key for every build: each APK was
            // signed by a different key, every install over the previous one
            // failed with a signature mismatch, and the module had to be
            // uninstalled, reinstalled, re-enabled and re-scoped in LSPosed on
            // every single build. With a fixed key, builds install over the top
            // and LSPosed keeps its settings.
            //
            // This is a debug key with the standard published password. It
            // proves nothing about who built the APK and is not used for
            // anything that needs a real signature.
            storeFile file('probe-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            // Sign release with the debug key so `assembleRelease` also produces
            // something LSPosed can install without extra keystore setup.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Java 8 bytecode keeps the sources consumable by the simple
        // javac + d8 toolchain used for the on-device Termux build
        // (tools/termux-build.sh), not just by AGP.
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // compileOnly: the stubs must never be packaged, LSPosed supplies the real
    // de.robv.android.xposed.* classes at runtime.
    compileOnly project(':xposed-stubs')
}
